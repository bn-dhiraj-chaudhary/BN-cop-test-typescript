# Coverity on Polaris (COP) capture/analyze configuration for cop-test-typescript.
# TypeScript is buildless for Coverity capture, so no build/clean commands are required.
version: "1"
serverUrl: https://csprod.polaris.synopsys.com
project:
  name: ${scm.git.repo}
  branch: ${scm.git.branch}
capture:
  fileSystem:
    javascript:
      files:
      - directory: ${project.projectDir}
    typescript:
      files:
      - directory: ${project.projectDir}
        excludeRegex: (node_modules|dist|\.git)/.*
  languages:
    include: [javascript, typescript]
analyze:
  mode: central
  coverity:
    cov-analyze:
      - "--webapp-security"
      - "--security"
      - "--enable"
      - "HARDCODED_CREDENTIALS"
      - "--enable"
      - "SQLI"
      - "--enable"
      - "OS_CMD_INJECTION"
install:
  coverity:
    version: default
